pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        // NeoGradle 7 is used by the NeoForge 1.20.2, 1.20.3, and 1.20.5
        // API eras, which predate the moddev-bundle metadata required by
        // ModDevGradle. The plugin is not on the Gradle plugin portal.
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
    }
}

rootProject.name = 'TrueUUID'

// Every compiling adapter is included here and in release/targets.json. Runtime
// acceptance controls its release flag; it does not remove the adapter from CI.
include 'shared:protocol'
include 'shared:presentation'
include 'shared:server-core'

// Local development and acceptance runs may set -Ptrueuuid.onlyTarget=<id> to
// include only that manifest target beside the shared modules. ForgeGradle 6
// registers run tasks only after every included project is evaluated, which
// configure-on-demand never does, so a narrower project set is the reliable way
// to avoid setting up every loader for one run. Builds without it are unchanged.
def onlyTarget = providers.gradleProperty('trueuuid.onlyTarget').orNull

// Unsupported plugin candidates are intentionally outside release/targets.json
// until their installed-JAR acceptance matrix is complete. They still compile
// and test explicitly in CI and may not be published by manifest-driven tasks.
if (onlyTarget == null) {
    include 'plugin:bukkit-common'
    include 'plugin:spigot:1.20.1'
}

// release/targets.json is the single target inventory. Standalone build
// islands own their own wrapper/settings and are deliberately not included in
// the root Gradle build.
def targetManifest = new groovy.json.JsonSlurper().parse(file('release/targets.json'))
def rootTargets = targetManifest.targets.findAll { !(it.standalone ?: false) }
if (onlyTarget != null) {
    rootTargets = rootTargets.findAll { it.id == onlyTarget }
    if (rootTargets.isEmpty()) {
        throw new GradleException(
                "trueuuid.onlyTarget must name a root-build target in release/targets.json: ${onlyTarget}")
    }
}
rootTargets.each { target ->
    def projectPath = "platform:${target.id}"
    include projectPath
    project(":${projectPath}").projectDir =
            file("platform/${target.loader}/${target.game_version}")
}
