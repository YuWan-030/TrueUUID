buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

ext.forgeTarget = [
        minecraftVersion     : '1.20.2',
        minecraftVersionRange: '[1.20.2,1.20.3)',
        forgeVersion         : '48.1.0',
        forgeVersionRange    : '[48.1.0,49)',
        forgeLoaderRange     : '[48,)',
        javaVersion          : 17,
        javaCompatibility    : 'JAVA_17',
        packFormat           : 18,
        layeredHud           : false,
        streamCodec          : false
]

apply from: "${rootDir}/platform/forge/common/legacy-matrix.gradle"
