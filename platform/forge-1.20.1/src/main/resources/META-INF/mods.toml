# Metadata for the 1.20.1 anchor. platform/neoforge-1.20.1 recompiles these
# same sources and expands this file with its own loader ranges, so keep every
# value a placeholder rather than a Forge-specific literal. Presentation values
# come from gradle.properties; scripts/ci/verify-release-jar.sh rejects a JAR
# whose embedded name, license, or authors disagree with it.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/YuWan-030/TrueUUID"
logoFile = "trueuuid-banner.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# The Mixin configuration is declared through the jar manifest's MixinConfigs
# attribute for this target; see build.gradle.

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
# This adapter is compiled against one exact login protocol and mapping set.
# Widen only after that exact patch passes its own runtime checks.
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
