plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    // NeoForge 20.2 predates the moddev-bundle Gradle metadata that
    // ModDevGradle 2 requires (verified against 20.2.93's .module file,
    // 2026-07-16: 20.4+ publish the bundle, 20.2 does not), so this one
    // module uses the era-native NeoGradle 7 userdev plugin instead. Every
    // other NeoForge module stays on ModDevGradle.
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

evaluationDependsOn(':shared:protocol')
def sharedProtocolMain = project(':shared:protocol')
        .extensions.getByType(org.gradle.api.tasks.SourceSetContainer)
        .named('main')
def adapterMain = "${rootDir}/platform/neoforge/common/src/main"
def adapterTests = "${rootDir}/platform/neoforge/common/src/test"
def mainClassesDir = layout.buildDirectory.dir('classes/java/main')
def minecraftVersion = '1.20.2'
// NeoForge 20.2.93 is the latest stable of the 20.2 line
// (maven.neoforged.net, checked 2026-07-16).
def neoForgeVersion = '20.2.93'

group = 'cn.alini'
version = providers.gradleProperty('mod_version').get()

// This era predates the neoforge.mods.toml rename: its metadata file is
// META-INF/mods.toml with javafml "[1,)" (verified against the 20.2.93
// universal jar's own manifest, 2026-07-16). The shared
// META-INF/mods.toml. The shared metadata helper selects that legacy filename
// without adding the modern neoforge.mods.toml resource.
ext.neoforgeMetadata = [
        loaderRange: "[${neoForgeVersion},)",
        minecraftRange: '[1.20.2,1.20.3)',
        javafmlRange: '[1,)',
        file: 'META-INF/mods.toml',
        legacy: true
]
apply from: "${rootDir}/platform/neoforge/common/metadata.gradle"

base { archivesName = 'trueuuid' }

repositories { mavenCentral() }

// Recompile the hardened modern NeoForge adapter against this exact target.
// Only this target's metadata, era seams, and run configuration live in this
// module. Pointing this module at the unmodified shared source (2026-07-16)
// failed to compile exactly four files; NetIds was fixed in the shared source
// itself (ResourceLocation.tryParse is present across 1.20.2-1.21.11) and the
// other three are excluded here, each replaced from a named shared era root
// rather than a module-local copy. neoforge-1.20.3 selects the same roots:
// - TrueuuidClientOverlay: RegisterGuiLayersEvent is 1.21+; 20.2 uses the
//   pre-1.21 RegisterGuiOverlaysEvent + Mod.EventBusSubscriber form.
//   (overlay-20.2-20.4)
// - mixin/server/ServerLoginMixin and net/AuthAnswerPackets: NeoForge 20.2 and
//   20.3 wrap login answers in their own SimpleQueryPayload on the
//   client-to-server wire, and onDisconnect takes Component before 1.21
//   (DisconnectionDetails does not exist yet). NeoForge 20.4 dropped the
//   wrapper for the vanilla payload. (login-20.2-20.3)
// - config/TrueuuidConfig: FML 1.x registers configs on ModLoadingContext,
//   not ModContainer. (config-20.2-20.4)
def preModernSources = [
        'cn/alini/trueuuid/TrueuuidClientOverlay.java',
        'cn/alini/trueuuid/mixin/server/ServerLoginMixin.java',
        'cn/alini/trueuuid/net/AuthAnswerPackets.java',
        'cn/alini/trueuuid/config/TrueuuidConfig.java'
]
sourceSets.main.java.srcDir "${adapterMain}/java"
sourceSets.main.java.srcDir "${rootDir}/platform/common/forgelike/src/main/java"
sourceSets.main.java.srcDir "${rootDir}/platform/common/forgelike/src/pause-pose/java"
sourceSets.test.java.srcDir "${adapterTests}/java"
sourceSets.main.resources.srcDir "${rootDir}/platform/common/assets/src/main/resources"

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

runs {
    client {
        modSource sourceSets.main
    }
    server {
        modSource sourceSets.main
        programArgument '--nogui'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoForgeVersion}"
    implementation project(':shared:protocol')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// NeoGradle 7 turns each classes directory attached to a source-set output
// into a separate secure module. The shared protocol then becomes invisible
// to TrueUUID at runtime even though the release jar is correct. Merge its
// plain-Java classes into the dev mod's own classes directory instead.
def mergeSharedProtocolClasses = tasks.register('mergeSharedProtocolClasses', Copy) {
    dependsOn ':shared:protocol:classes', tasks.named('compileJava')
    from(sharedProtocolMain.get().output.classesDirs)
    include '**/*.class'
    into(mainClassesDir)
}
tasks.named('classes') {
    dependsOn mergeSharedProtocolClasses
}

// Same mechanism as neoforge-1.21.8's modernGuiSources: compile the shared
// tree minus the era seams, plus this module's local replacements (which live
// at the same relative paths, so a plain source-set exclude would drop both).
tasks.named('compileJava', JavaCompile).configure {
    source = files(fileTree("${adapterMain}/java") { exclude preModernSources },
            fileTree("${rootDir}/platform/common/forgelike/src/main/java"),
            fileTree("${rootDir}/platform/common/forgelike/src/pause-pose/java"),
            fileTree("${rootDir}/platform/neoforge/common/src/overlay-20.2-20.4/java"),
            fileTree("${rootDir}/platform/neoforge/common/src/config-20.2-20.4/java"),
            fileTree("${rootDir}/platform/neoforge/common/src/login-20.2-20.3/java"))
}

tasks.named('jar', Jar).configure {
    archiveFileName = "trueuuid-${project.version}-neoforge-${minecraftVersion}.jar"
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
apply from: "${rootDir}/platform/neoforge/common/verify-login-wire.gradle"
