buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}
ext.forgeTarget = [minecraftVersion: '1.21', minecraftVersionRange: '[1.21,1.21.1)',
        forgeVersion: '51.0.33', forgeVersionRange: '[51,52)', sourceEra: 'eventbus6', hudLayer: 'mixin']
apply from: "${rootDir}/platform/forge-common/modern-target.gradle"
